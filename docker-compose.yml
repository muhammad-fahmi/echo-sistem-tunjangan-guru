version: "3.7"
services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    image: "app-php7.4"
    volumes:
      - ./:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      VIRTUAL_HOST: sipekakrenta.jembranakab.go.id
      TZ: "Asia/Makassar"
    restart: always

networks:
  default:
    external:
      name: nginx-proxy
